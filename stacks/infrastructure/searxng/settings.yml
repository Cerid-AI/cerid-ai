# Minimal SearXNG settings overlay for the optional `searxng` compose
# service (docker-compose.yml, profile "searxng").
#
# `use_default_settings: true` inherits every other key (engines, UI,
# outgoing request config, etc.) from the image's built-in defaults —
# this file only overrides what verification evidence sourcing needs:
# the JSON output format (disabled by default) that
# utils/web_search.py::SearxngProvider queries via `?format=json`.
#
# The server secret is deliberately NOT set here — a committed secret
# fails the detect-secrets gate and rots into a shared default. The
# compose service injects it via the SEARXNG_SECRET environment variable
# (the image maps it onto server.secret_key); generate one into .env
# when enabling the profile:  openssl rand -hex 32
use_default_settings: true

server:
  limiter: false

search:
  formats:
    - html
    - json

# The image enables three web engines (brave, duckduckgo, google cse). Under
# moderate use all three were suspended at once (too many requests, timeout),
# and web search returned nothing. Yahoo answered from the same host while
# they were down; bing, qwant, google and duckduckgo web were blocked.
engines:
  - name: yahoo
    disabled: false
