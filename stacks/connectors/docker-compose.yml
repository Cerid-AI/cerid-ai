# Cerid AI — Pro-tier cloud connector stack.
#
# Sibling MCP servers run in their own containers and the Cerid MCP server
# fans queries across them via MCPClientPool over streamable-HTTP. Each
# upstream repo provides its own Dockerfile; we pin by git commit SHA to
# avoid surprise upgrades — especially softeria, which ships 200+ releases
# (one per day on its peak weeks).
#
# Bring this stack up explicitly:
#   docker compose -f docker-compose.yml -f stacks/connectors/docker-compose.yml \
#     --profile pro up -d
#
# Or via scripts/start-cerid.sh --with-connectors (added in Phase F Day 7).
#
# OAuth credentials persist in named volumes keyed per connector so a
# `docker compose down` (without -v) preserves refresh tokens.

# YAML anchors do not cross compose files, so the main file's x-logging cannot
# be reused here — these two need their own. Same cap and same reason: the
# json-file driver is unbounded by default.
x-logging: &connector-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  # ── Cerid MCP server — extends the main compose file's service ─────────
  # Keeps llm-network for the datastores and gains `connectors` so
  # MCPClientPool can still resolve the siblings by name after they moved
  # off the shared network. Compose merges the two `networks` lists.
  mcp-server:
    networks:
      - llm-network
      - connectors

  # ── Google Workspace MCP — Gmail + Google Calendar ─────────────────────
  # Upstream: github.com/taylorwilsdon/google_workspace_mcp (v1.21.0)
  # Tools surfaced to Cerid: search_gmail_messages, get_gmail_message_content,
  # list_calendars, get_events. Single-user OAuth mode keeps the credential
  # path simple — one Google Cloud "Desktop app" client per Cerid install.
  #
  # Everything below was rewritten on 2026-08-09, the first time this service
  # was actually started. As shipped it could not run at all, and two of its
  # settings were inert. Each fix is annotated; do not "simplify" them back.
  google-workspace-mcp:
    container_name: cerid-google-workspace-mcp
    logging: *connector-logging
    profiles: ["pro"]
    build:
      # Pinned to v1.21.0 commit so we don't pick up breaking changes
      # silently. Bump deliberately + smoke-test the tools/list shape.
      context: https://github.com/taylorwilsdon/google_workspace_mcp.git#v1.21.0
    # ONE shell string, not a flag list. The image's ENTRYPOINT is
    # ["/bin/sh","-c"], so a list becomes sh's own argv and the container
    # crash-loops with `/bin/sh: 0: Illegal option --`.
    #
    # --single-user has no env equivalent (MCP_SINGLE_USER_MODE is set BY this
    # flag, not read as input), which is why the override exists at all.
    # --read-only is the REAL scope restriction: it requests read-only scopes
    # and disables write tools. The previous WORKSPACE_MCP_ALLOWED_SCOPES was
    # read by nothing — grep the image, there are zero references — so the
    # "read-only by default" this file used to claim was never enforced.
    command:
      - "uv run main.py --transport streamable-http --single-user --read-only --tools gmail calendar"
    # Container and host port MUST match. The OAuth redirect_uri is built as
    # WORKSPACE_MCP_BASE_URI:WORKSPACE_MCP_PORT (auth/oauth_config.py) — i.e.
    # from the LISTEN port, with no notion of a published one. With the old
    # 8810:8000 mapping the consent screen redirected the browser to
    # localhost:8000, where nothing listens, so the handshake could never
    # complete even once the server was reachable.
    ports:
      # Loopback is HARD-CODED, not ${CERID_BIND_ADDR}. Neither sibling has
      # any client-auth mechanism, and ms365 additionally runs with the bearer
      # check disabled, so the bind address is load-bearing security — one
      # stray export of CERID_BIND_ADDR=0.0.0.0 would put an unauthenticated
      # reader of the operator's mail and calendar on the LAN. Published at
      # all only because the Google OAuth consent redirect targets this port
      # from the operator's browser (see the port-match note above).
      - "127.0.0.1:${CERID_PORT_GOOGLE_MCP:-8810}:${CERID_PORT_GOOGLE_MCP:-8810}"
    environment:
      # Operator provides these in .env from a Google Cloud Console
      # "Desktop app" OAuth client. The sibling-MCP server owns the OAuth
      # flow + refresh-token rotation; Cerid backend never touches them.
      - GOOGLE_OAUTH_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID:-}
      - GOOGLE_OAUTH_CLIENT_SECRET=${GOOGLE_OAUTH_CLIENT_SECRET:-}
      # Host/port are env-only; --host/--port are NOT flags this server accepts
      # (see `main.py --help`), and passing them was part of why it never ran.
      - WORKSPACE_MCP_HOST=0.0.0.0
      - WORKSPACE_MCP_PORT=${CERID_PORT_GOOGLE_MCP:-8810}
      # The account the single-user OAuth flow connects. start_google_auth
      # takes it as a parameter and defaults to this; without it Cerid's
      # /connectors/gmail/auth/start has no account to start a consent for.
      - USER_GOOGLE_EMAIL=${USER_GOOGLE_EMAIL:-}
      # NOTE: this server has no client-auth mechanism — there is no
      # WORKSPACE_MCP_AUTH_TOKEN in the image. The bearer Cerid sends is
      # ignored here, and the service's protection is that it is bound to
      # loopback (CERID_BIND_ADDR). Do not re-add the variable: it read as a
      # security control that did not exist. Neither sibling honours a bearer
      # — ms365-mcp had the same dead setting under a different name.
    volumes:
      # Mounted at the HOME dir, not at ~/.google_workspace_mcp. Docker seeds a
      # fresh named volume from the image path — including ownership — only
      # when that path exists in the image. ~/.google_workspace_mcp does not,
      # so it was created root-owned while the server runs as uid 1000 (app),
      # and OAuth tokens could never have been written. /home/app does exist
      # and is app-owned, so the volume inherits that. Verified empirically.
      - google-workspace-mcp-credentials:/home/app
    networks:
      - connectors
    restart: unless-stopped
    healthcheck:
      # The streamable-HTTP endpoint accepts an unauthenticated GET on /mcp
      # for liveness probing (returns 405/406 for non-JSON-RPC requests; any
      # response means the process is alive). curl -sf treats 4xx as success
      # via --fail-with-body so we accept any byte-back.
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:${CERID_PORT_GOOGLE_MCP:-8810}/mcp | grep -qE '^(2|4)' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  # ── Microsoft 365 MCP — Outlook Mail + Outlook Calendar ─────────────────
  # Upstream: github.com/Softeria/ms-365-mcp-server (v0.111.0)
  # MSAL device-code OAuth — the user pastes a code at microsoft.com/devicelogin.
  # Tools scope-restricted to Mail.Read + Calendars.Read for v1.
  ms365-mcp:
    container_name: cerid-ms365-mcp
    logging: *connector-logging
    profiles: ["pro"]
    build:
      # Pinned by tag. Softeria ships ~1 release/day — every bump must pass the
      # smoke test before we move the pin.
      #
      # Moved off v0.111.0 on 2026-08-09: that tag's image CANNOT BE BUILT. Its
      # release stage ran `npm ci --omit=dev` on node:20 while the builder used
      # node:24, and the two npm majors disagreed about the lockfile —
      # `Missing: yaml@2.9.0 from lock file`, exit 1, every time. v0.137.0 uses
      # node:24 in both stages, which removes the split.
      context: https://github.com/softeria/ms-365-mcp-server.git#v0.137.0
    # ENTRYPOINT is ["node","dist/index.js"], so these ARE argv (unlike the
    # Google sibling, whose entrypoint is a shell).
    #   --enable-auth-tools: login/logout tools are OFF by default in HTTP
    #     mode, and they are how the device-code flow is driven.
    #   --read-only: real, enforced; the scope allowlist below is a second
    #     belt but this is the switch that disables write operations.
    command:
      - "--http=3000"
      - "--enable-auth-tools"
      - "--read-only"
      # Loopback-bound, so the bearer check is redundant with the access control this
      # stack already relies on. All callers share the cached MSAL identity.
      - "--trust-proxy-auth"
    ports:
      # Loopback HARD-CODED — see the google-workspace-mcp note. This one
      # runs --trust-proxy-auth, so there is no token check at all behind it.
      - "127.0.0.1:${CERID_PORT_MS365_MCP:-8811}:3000"
    environment:
      # File-based token cache because keytar isn't available in containers.
      - MS365_MCP_TOKEN_CACHE_PATH=/data/token-cache.json
      # Scope restriction for v1 — read-only Mail + Calendar. Verified real:
      # cli.js reads this into options.allowedScopes.
      #
      # WHITESPACE-separated, not comma. `--help` says so and the parser means
      # it: the old comma form was read as ONE scope literally named
      # "Mail.Read,Calendars.Read", which matched nothing, so every mail and
      # calendar tool was filtered out and the server exposed only its auth and
      # utility tools. Graph then answered 403 on verify-login. Eleven tools
      # were listed either way, which is what made it look like it was working.
      - MS365_MCP_ALLOWED_SCOPES=${MS365_MCP_SCOPES:-Mail.Read Calendars.Read}
      # MSAL authority. Unset means "common", which as of June 2026 fails
      # SILENT REFRESH for personal Microsoft accounts — the first login works
      # and every renewal after it does not. Personal accounts need
      # "consumers"; a work/school tenant needs its tenant id (or "organizations").
      - MS365_MCP_TENANT_ID=${MS365_MCP_TENANT_ID:-}
      #
      # Two variables were REMOVED here on 2026-08-09 because the image never
      # read either of them (grep the bundle in dist/ — neither name appears):
      #
      #   MS365_MCP_AUTH_TOKEN=${CERID_CONNECTORS_BEARER}
      #     Documented as "static bearer for client→server auth". No such
      #     setting exists; the real name is MS365_MCP_OAUTH_TOKEN and it is an
      #     inbound Graph token, not a client-auth secret. Like the Google
      #     sibling, this server's protection is loopback binding.
      #   MS365_MCP_MODE=personal
      #     The real switch is MS365_MCP_ORG_MODE, which enables ORG mode when
      #     "true"/"1". Personal is the default when it is unset, so the
      #     intended behaviour is what you get by saying nothing.
    volumes:
      - ms365-mcp-data:/data
    networks:
      - connectors
    restart: unless-stopped
    healthcheck:
      # curl is NOT in this image — the healthcheck shipped broken and the
      # container sat "unhealthy" (failing streak 3010) for its whole life
      # while the server answered every real request. `/bin/sh: curl: not
      # found` was the only output the probe ever produced. node IS present
      # (it is the ENTRYPOINT), so use its own fetch. A plain GET on the
      # streamable-HTTP endpoint answers 406 — any sub-500 status means the
      # process is alive and serving. Verified in-container, including a
      # negative control against a dead port (exit 1).
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/mcp').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

# ── Networks ────────────────────────────────────────────────────────────
#
# The siblings were on the shared `llm-network` until 2026-08-27. That put
# them one DNS name away from all eight other containers on it — cerid-web,
# cerid-sso, cerid-gateway, neo4j, chroma, redis. Since ms365-mcp runs with
# --trust-proxy-auth (no bearer check) and google-workspace-mcp has no
# client-auth mechanism in the image at all, every one of those containers
# could read the operator's mail and calendar with no credential. Verified:
# an unauthenticated tools/list against ms365 returns all 32 Graph tools.
#
# The host-port binding was never the control it was documented to be — it
# does not apply to traffic inside the bridge network. `connectors` is that
# control: only mcp-server, the one legitimate client, is attached.
#
# NOT `internal: true` — both siblings must reach graph.microsoft.com and
# googleapis.com outbound.
networks:
  llm-network:
    external: true
  connectors:
    driver: bridge


volumes:
  google-workspace-mcp-credentials:
  ms365-mcp-data:
