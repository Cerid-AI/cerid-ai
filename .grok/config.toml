# Project MCP servers for Grok Build (mirrors .mcp.json)

[mcp_servers.cerid-kb]
type = "sse"
url = "http://localhost:8888/mcp/sse"

[mcp_servers.contextplus]
command = "npx"
args = ["-y", "contextplus"]
env = { OLLAMA_EMBED_MODEL = "jina-embeddings-v2-base-code", OLLAMA_CHAT_MODEL = "llama3.1-8b", CONTEXTPLUS_EMBED_BATCH_SIZE = "8", CONTEXTPLUS_EMBED_TRACKER = "lazy" }
