upstream cerid_mcp {
    server ai-companion-mcp:8888 max_fails=0;
    keepalive 32;
}

# localhost, 127.0.0.1, [::1], cerid-web and CERID_HOST, written by
# docker-entrypoint.sh. Every location that forwards a request refuses a Host
# outside this list. Static files are served under any name: they carry
# nothing, and a gateway in front of this container keeps the browser's Host.
map $host $cerid_known_host {
    default 0;
    include /etc/nginx/conf.d/cerid-hosts.inc;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Security headers (HSTS/CSP handled by Caddy gateway when enabled)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Hashed static assets — immutable cache, return 404 on miss (never fallback to index.html)
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # SPA fallback — all routes serve index.html
    # Never cache HTML responses (SPA entry + env-config change between deploys)
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        expires -1;
        try_files $uri $uri/ /index.html;
    }

    # Bifrost proxy removed (2026-04-18) — Bifrost was retired; all LLM calls
    # go direct-to-OpenRouter via core/utils/llm_client. See CLAUDE.md
    # "Bifrost retirement" convention block.

    # Sign-in. The service is named through a variable so nginx resolves it
    # per request: it starts, and keeps serving the app shell, while cerid-sso
    # is down. `internal` keeps the check itself off the network.
    location = /__auth_check {
        internal;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $cerid_sso http://cerid-sso:8080;
        proxy_pass $cerid_sso/__auth/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-API-Key $http_x_api_key;
        proxy_set_header Cookie $http_cookie;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
    }

    location /__auth/ {
        if ($cerid_known_host = 0) { return 421; }
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $cerid_sso http://cerid-sso:8080;
        proxy_pass $cerid_sso;
        proxy_set_header Host $http_host;
        # This port is plain HTTP, where a Secure cookie is not kept.
        proxy_set_header X-Cerid-Edge "local";
        proxy_connect_timeout 2s;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location @sign_in_required {
        default_type application/json;
        add_header X-Cerid-Auth "sign-in-required" always;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        return 401 '{"detail":"Sign in to use Cerid on this port.","error_code":"SIGN_IN_REQUIRED","login":"/__auth/login"}';
    }

    location @sign_in_unavailable {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        return 503 '{"detail":"The sign-in service (cerid-sso) is not answering, so this port will not forward requests. Start it with scripts/start-cerid.sh.","error_code":"SIGN_IN_UNAVAILABLE"}';
    }

    # The two liveness probes answer before sign-in, as they do on the API
    # itself, and are forwarded without the key.
    location = /api/mcp/health/ping {
        if ($cerid_known_host = 0) { return 421; }
        proxy_pass http://cerid_mcp/health/ping;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
    }
    location = /api/mcp/health/live {
        if ($cerid_known_host = 0) { return 421; }
        proxy_pass http://cerid_mcp/health/live;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
    }

    # Proxy MCP API (avoids CORS + ensures SSE reliability)
    location /api/mcp/ {
        if ($cerid_known_host = 0) { return 421; }
        # The key below is added while proxying, which nginx reaches only
        # after this check has passed. Anything the check answers other than
        # 2xx or 401 (the service is down, or unresolvable) surfaces as 500.
        auth_request /__auth_check;
        auth_request_set $cerid_port_access $upstream_http_x_cerid_port_access;
        error_page 401 = @sign_in_required;
        error_page 500 =503 @sign_in_unavailable;
        # "open" when no sign-in password is set. add_header here replaces the
        # server-level headers, so they are repeated.
        add_header X-Cerid-Port-Access $cerid_port_access always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        client_max_body_size 50m;
        proxy_pass http://cerid_mcp/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # With the port: the API matches a browser's Origin against it.
        proxy_set_header Host $http_host;
        # Without these the API sees every browser as this container's IP:
        # one rate-limit bucket for the whole LAN (five bad passwords lock
        # /auth/ for everyone) and one redacted hash in every auth log line.
        # The API only reads them when TRUSTED_PROXIES lists this network.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 2s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 5s;
        # SSE support for verify-stream
        proxy_set_header Accept-Encoding "";
        chunked_transfer_encoding on;
        # Server-side X-API-Key injection, written by docker-entrypoint.sh.
        # It replaces whatever key the caller sent; the sign-in check above
        # has already judged the caller's own.
        # The key used to be shipped to the browser in env-config.js, which
        # nginx serves unauthenticated — so on a LAN bind anyone who could
        # reach :3000 could read the credential and replay it directly against
        # :8888, cancelling the LAN auth gate in app/middleware/auth.py.
        # Injecting here keeps the same-origin SPA working without disclosing
        # the secret. The file always exists (empty when there is no key, or
        # when the operator points VITE_MCP_URL straight at the API).
        include /etc/nginx/conf.d/cerid-api-key.inc;
    }

    # Runtime config files — never cache (regenerated on container start)
    location = /env-config.js {
        # Refuses an unknown Host when the file holds the API key.
        include /etc/nginx/conf.d/cerid-env-config.inc;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        expires -1;
    }
    location = /version.json {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Access-Control-Allow-Origin "*";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        expires -1;
    }

    # Cache static assets (hashed filenames make immutable safe)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Gzip
    gzip on;
    gzip_comp_level 4;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 256;
}
