name: Eval Exploratory

# Workstream E Phase 2c — Nightly exploratory eval suite.
#
# Runs the full benchmark_suite (synthetic eval-corpus + keyword
# coverage of the 5 public datasets) against a freshly-booted cerid
# stack. Doesn't gate PR merges; provides drift signal that surfaces
# as a Job Summary + uploaded JSON artifact + non-zero exit code on
# regression (which GitHub turns into a notification on the workflow
# run).
#
# BEIR datasets (SciFact + NFCorpus) are NOT seeded here — the seed
# alone takes ~2.5h on a single CPU runner due to embedding throughput.
# BEIR baseline is captured locally and committed; drift against it
# can be checked manually via `workflow_dispatch` with
# `seed_beir: true`, or via a separate weekly schedule once we
# decide to commit the runner-time.
#
# See driver doc § 13 (tasks/2026-04-28-workstream-e-rag-modernization.md)
# and docs/EVAL_BASELINES.md § Public benchmark datasets.

on:
  schedule:
    # 07:30 UTC — half an hour after the nightly ragas-eval to avoid
    # piling concurrent stack boots onto the same runner pool.
    - cron: "30 7 * * *"
  workflow_dispatch:
    inputs:
      seed_beir:
        description: "Also seed BEIR corpora (~2h on CPU runner)"
        required: false
        default: "false"
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exploratory:
    name: eval / exploratory (live stack)
    runs-on: ubuntu-latest
    timeout-minutes: 60  # synthetic + keyword only; bump if seed_beir=true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: src/mcp/requirements.lock

      - name: Seed .env for the stack boot
        # Mirrors the benchmark-slo job's pattern: copy .env.example,
        # inject CI-only secrets, pre-create the writable sync dir for
        # the cerid uid 1000 inside the container.
        run: |
          cp .env.example .env
          echo "NEO4J_PASSWORD=expCIpassword" >> .env
          echo "REDIS_PASSWORD=expCIpassword" >> .env
          echo "OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}" >> .env
          mkdir -p /tmp/cerid-sync/user
          chmod -R 777 /tmp/cerid-sync
          echo "CERID_SYNC_DIR_HOST=/tmp/cerid-sync" >> .env

      - name: Boot Cerid stack
        run: |
          docker network create llm-network 2>/dev/null || true
          docker compose -f docker-compose.yml -f docker-compose.ci.yml \
            up -d --wait --wait-timeout 300
          for i in {1..30}; do
            if curl -sf http://localhost:8888/health | grep -q '"status":"healthy"'; then
              echo "stack ready after $i attempts"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Stack did not reach /health healthy within 60s"
          docker compose -f docker-compose.yml -f docker-compose.ci.yml logs --tail 200
          exit 1

      - name: Seed synthetic eval-corpus v1
        # Fast (~30s for 20 docs); always runs. Keyword scoring depends
        # on a non-empty corpus to retrieve from.
        run: |
          docker cp scripts/seed_eval_corpus.py ai-companion-mcp:/tmp/
          docker exec -e PYTHONPATH=/app ai-companion-mcp \
            python /tmp/seed_eval_corpus.py

      - name: Optionally seed BEIR (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch' && inputs.seed_beir == 'true'
        run: |
          docker cp scripts/seed_beir_corpus.py ai-companion-mcp:/tmp/
          docker exec -e PYTHONPATH=/app ai-companion-mcp \
            python /tmp/seed_beir_corpus.py

      - name: Run exploratory benchmark suite
        # Calls benchmark_suite.run_suite() — Phase 2a's mode dispatch
        # auto-selects IR scoring for the synthetic corpus and keyword
        # coverage for the 5 keyword-only public datasets. Output
        # written to suite-report.json + posted as job summary.
        run: |
          docker exec -e PYTHONPATH=/app ai-companion-mcp python -c "
          import asyncio, json
          from app.eval.benchmark_suite import run_suite, format_report
          report = asyncio.run(run_suite())
          payload = {
              'pipeline': report.pipeline,
              'timestamp': report.timestamp,
              'overall_score': report.overall_score,
              'results': [
                  {
                      'category': r.category,
                      'mode': r.mode,
                      'n_queries': r.n_queries,
                      'avg_ndcg_5': r.avg_ndcg_5,
                      'avg_ndcg_10': r.avg_ndcg_10,
                      'avg_mrr': r.avg_mrr,
                      'avg_precision_5': r.avg_precision_5,
                      'avg_recall_10': r.avg_recall_10,
                      'avg_keyword_coverage': r.avg_keyword_coverage,
                      'avg_keyword_precision': r.avg_keyword_precision,
                      'avg_latency_ms': r.avg_latency_ms,
                  }
                  for r in report.results
              ],
          }
          with open('/tmp/suite-report.json', 'w') as f:
              json.dump(payload, f, indent=2)
          print(format_report(report))
          " > suite-report.md
          docker cp ai-companion-mcp:/tmp/suite-report.json suite-report.json

      - name: Post report to job summary
        if: always()
        run: |
          {
            echo "# Exploratory Benchmark Report"
            echo ""
            cat suite-report.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Compare against keyword baseline
        # Phase 2a baseline file enumerates the 5 keyword datasets +
        # threshold (0.05 absolute, looser than IR's 0.02 per the
        # dual-gate decision). The keyword harness test is the
        # authority — running it here flips a real fail signal when
        # observed coverage drops below baseline.
        run: |
          docker exec -e PYTHONPATH=/app ai-companion-mcp \
            python -m pytest tests/eval/test_keyword_harness.py -v --tb=short
        continue-on-error: true  # Drift is a signal, not a gate

      - name: Upload suite report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-exploratory-${{ github.run_id }}
          path: |
            suite-report.json
            suite-report.md
          if-no-files-found: warn

      - name: Capture stack logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml logs --tail 500

      - name: Teardown
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v
