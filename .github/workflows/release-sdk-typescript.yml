name: Release / cerid-sdk (TypeScript)

# Publish the TypeScript SDK at packages/sdk/typescript/ to npm.
#
# Triggers:
#   * push of a tag matching ``cerid-sdk-ts-v*`` — auto-publishes to npm
#     after asserting the tag matches package.json's version.
#   * workflow_dispatch — manual fire with a target chooser
#     (``dry-run`` for a local `npm pack` sanity check, ``npm`` for the
#     real release).
#
# Auth: npm granular access token via GitHub secret ``NPM_TOKEN``
# (repo + environment ``npm``). Classic tokens that "bypass 2FA" are no
# longer accepted by npm — use a granular token with publish rights on
# ``@cerid-ai/sdk`` (and optional OIDC trusted publisher as a future
# dual-path). See docs/SDK_PUBLISHING.md.
#
# GitHub Environments: only the publish job binds ``npm``. Dry-runs never
# create Deployments. Re-dispatch with target=npm on an already-published
# version succeeds and marks the environment current (skip re-upload).

on:
  push:
    tags:
      - "cerid-sdk-ts-v*"
  workflow_dispatch:
    inputs:
      target:
        description: "Publish target"
        required: true
        default: "dry-run"
        type: choice
        options:
          - dry-run
          - npm

# Rule 1: artifact-publishing workflow — never cancel in-flight runs so a
# half-published release doesn't ship to npm.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  # Provenance attestation still uses OIDC when the runner supports it;
  # publish auth itself is the NPM_TOKEN (granular / automation).
  id-token: write

jobs:
  build:
    name: Build + test @cerid-ai/sdk
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/sdk/typescript
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: src/web/.nvmrc
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: packages/sdk/typescript/package-lock.json

      - name: Assert tag matches package.json version (tag-triggered only)
        if: github.event_name == 'push'
        run: |
          tag_version="${GITHUB_REF#refs/tags/cerid-sdk-ts-v}"
          pkg_version=$(node -p "require('./package.json').version")
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::Tag version ($tag_version) does not match package.json version ($pkg_version)"
            exit 1
          fi
          echo "Releasing @cerid-ai/sdk v$pkg_version"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run package tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify packed artifact (npm pack --dry-run)
        run: npm pack --dry-run

      - name: Pack for dry-run inspection
        if: github.event_name == 'workflow_dispatch' && inputs.target == 'dry-run'
        run: npm pack

  publish:
    name: Publish @cerid-ai/sdk to npm
    needs: build
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.target == 'npm')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: npm
      url: https://www.npmjs.com/package/@cerid-ai/sdk
    defaults:
      run:
        working-directory: packages/sdk/typescript
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: src/web/.nvmrc
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: packages/sdk/typescript/package-lock.json
          # Writes .npmrc with //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}
          # setup-node reads NODE_AUTH_TOKEN from the env below at publish time.

      - name: Require NPM_TOKEN
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::NPM_TOKEN secret is empty. Set it on the repo and/or the npm environment (granular access token with publish on @cerid-ai/sdk)."
            exit 1
          fi
          echo "NPM_TOKEN is present (length ${#NODE_AUTH_TOKEN})"

      - name: Skip if version already on npm
        id: already
        run: |
          pkg_version=$(node -p "require('./package.json').version")
          echo "version=$pkg_version" >> "$GITHUB_OUTPUT"
          if npm view "@cerid-ai/sdk@${pkg_version}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::@cerid-ai/sdk@${pkg_version} is already on npm — marking Deployments current without re-upload"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "Will publish @cerid-ai/sdk@${pkg_version}"
          fi

      - name: Install dependencies
        if: steps.already.outputs.published != 'true'
        run: npm ci

      - name: Typecheck
        if: steps.already.outputs.published != 'true'
        run: npm run typecheck

      - name: Run package tests
        if: steps.already.outputs.published != 'true'
        run: npm test

      - name: Build
        if: steps.already.outputs.published != 'true'
        run: npm run build

      # Granular tokens + account 2FA: do not use classic "bypass 2FA" tokens.
      # Prefer --access public; provenance is best-effort (OIDC) and is not
      # required for a successful publish if the registry rejects it.
      - name: Publish to npm
        if: steps.already.outputs.published != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          # Prefer provenance when the runner can attest; fall back to plain
          # publish if the registry rejects provenance without trusted publisher.
          if npm publish --provenance --access public; then
            echo "Published with provenance"
          else
            echo "::warning::npm publish --provenance failed; retrying without provenance (token auth)"
            npm publish --access public
          fi
