name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # No paths-ignore here: the workflow must run on EVERY PR so the `ci-ok`
    # aggregator (the single required status check) always reports. A
    # workflow-level paths-ignore skips the whole workflow on docs-only PRs,
    # which leaves required checks "expected, never reported" → PR blocked
    # forever. The `changes` job below skips the real work on docs-only PRs, so
    # cost is preserved without the deadlock.
  # Merge-queue entry. Rule 7 ("high-cost gates are merge-only") only means
  # something if a merge-TIME run exists: without this trigger `push: main`
  # fires after the merge has already landed, so `docker` reported on a branch
  # that was already broken. The queue re-runs the full set against the merged
  # result before it lands.
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detect whether any non-docs path changed. FAIL-SAFE: any error/empty diff
  # yields code=true (run CI), so a detector bug can never skip required CI on a
  # real code change — worst case it runs cheap CI on a docs PR.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      code: ${{ steps.detect.outputs.code }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: detect
        run: |
          code=true
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=200 origin "${{ github.base_ref }}" >/dev/null 2>&1 || true
            files=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" 2>/dev/null || true)
          elif [ "${{ github.event_name }}" = "push" ]; then
            files=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" 2>/dev/null || true)
          else
            # merge_group: the queue branch has no stable base to diff against,
            # and merge time is exactly when narrowing the run is wrong. An
            # empty list means "run everything" below.
            files=""
          fi
          # code=false ONLY when we got a non-empty list AND every file is docs.
          if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -qvE '^(docs/|tasks/|[^/]*\.md$)'; then
            code=false
          fi
          echo "changed files:"; printf '%s\n' "$files"
          echo "code=$code"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  # Python backend
  lint:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install ruff==0.15.4
      - run: ruff check src/mcp/
      - run: pip install import-linter
      - name: Import boundary check
        run: cd src/mcp && lint-imports
      - name: lint / ci-required-gates
        # Every job in this workflow must be aggregated by `ci-ok`, or a
        # skipped gate reads as a passing one. Static half; the runtime half
        # runs in `ci-ok` itself.
        run: python scripts/lint-ci-required-gates.py --workflow .github/workflows/ci.yml

  typecheck:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r src/mcp/requirements.txt -r src/mcp/requirements-dev.txt
      - run: cd src/mcp && python -m mypy . --config-file ../../pyproject.toml

  test:
    needs: [changes, lint, typecheck]
    # Runs on pull_request, merge_group and push:main. This guard used to read
    # `github.event_name != 'pull_request'`, so the entire pytest suite first
    # executed AFTER a PR was already merged into main — the branch that ships
    # was where regressions were discovered. A unit-test suite is not the
    # high-cost class rule 7 defers to merge time; `docker` is.
    #
    # Rule 6: a dependency bump does not need the behavioural suite at PR time.
    # It opts in with the `dependabot-full-ci` label, and the merge queue and
    # push:main run it regardless — the filter is scoped to pull_request so a
    # dependabot PR entering the queue cannot skip a gate ci-ok enforces.
    if: >-
      needs.changes.outputs.code == 'true'
      && (github.event_name != 'pull_request'
      || github.actor != 'dependabot[bot]'
      || contains(github.event.pull_request.labels.*.name, 'dependabot-full-ci'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: src/mcp/requirements.lock
      - run: pip install -r src/mcp/requirements.txt
      - run: pip install pytest pytest-asyncio httpx pytest-cov respx 'fakeredis>=2.0,<3'
      - name: Run tests with coverage
        # `not integration` deselects tests that require live external services
        # (Redis, MCP HTTP server). Those tests run under the preservation gate
        # which boots the full stack; running them here would fail with
        # connection-refused on the bare ubuntu runner.
        run: cd src/mcp && python -m pytest tests/ -m "not benchmark_slo and not integration" -v --tb=short --cov=. --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=20
      - name: Gate probes (scripts/tests)
        # These prove the drift/lint gates can actually fail. Nothing ran them
        # until 2026-08-04.
        run: python -m pytest scripts/tests/ -q
      - name: Sign-in service tests (stacks/sso)
        # Stdlib only. Hand-ported from the canonical scripts/ci/test.sh.
        run: python -m pytest stacks/sso/test_sso.py -q -p no:cacheprovider
      # The MLX server (stacks/mlx-inference) has its own pinned packages, so its
      # tests run in their own venv on Python 3.12 with MLX on Linux CPUs.
      # MLX_STACK_TESTS_STRICT turns a dependency that failed to install into a
      # failure instead of a skip. Hand-ported from the canonical
      # scripts/ci/test.sh; this file is maintained by hand on this side.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: MLX server tests (stacks/mlx-inference)
        run: |
          python -m venv "$RUNNER_TEMP/mlx-stack-venv"
          "$RUNNER_TEMP/mlx-stack-venv/bin/pip" install -q -r stacks/mlx-inference/requirements-test.txt
          MLX_STACK_TESTS_STRICT=1 "$RUNNER_TEMP/mlx-stack-venv/bin/python" -m pytest stacks/mlx-inference/tests/ -q -p no:cacheprovider
      - name: Upload coverage to Codecov
        if: success()
        uses: codecov/codecov-action@v7
        with:
          files: src/mcp/coverage.xml
          fail_ci_if_error: false

  security:
    # No dependabot filter (rule 6: security audits always run — a bump is
    # exactly when pip-audit matters most). Runs on every event. Secret detection, bandit and pip-audit are the gates
    # that most need to fire BEFORE a commit reaches main, and they were the
    # ones skipped on pull_request.
    if: needs.changes.outputs.code == 'true'
    needs: [changes, lint, typecheck]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Full history for secret scanning
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # One definition shared with the internal tree (scripts/ci/security.sh):
      # detect-secrets over tracked files, bandit, pip-audit through
      # scripts/audit-python-deps.sh (whose ignore list carries the rationale
      # and re-evaluate date for every entry), and dlint. The inline copy this
      # replaces drifted from that list and went red on CVE-2026-45833.
      - name: Secrets, bandit, dependency audit, dlint (scripts/ci/security.sh)
        run: bash scripts/ci/security.sh

  lock-sync:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Use same Python image as Dockerfile to ensure identical pip-compile output
    # (Dockerfile is on python:3.12; sync-repos.py regenerates the lock in
    # python:3.12-slim — a 3.11 resolver here picks different transitives,
    # e.g. scipy 1.17 vs 1.18).
    container: python:3.12-slim
    steps:
      - uses: actions/checkout@v6
      - run: pip install pip-tools==7.5.3
      - name: Check Python lock file is up to date
        run: |
          cd src/mcp
          # Seed the output path with the committed lock so pip-compile preserves
          # existing pins (treats them as constraints) and only changes the lock
          # when requirements.txt itself changes — NOT whenever a new in-range
          # transitive version publishes on PyPI. Stops the daily latest-resolve
          # drift; intentional bumps stay a deliberate pip-compile re-run.
          cp requirements.lock /tmp/requirements.lock
          pip-compile requirements.txt -o /tmp/requirements.lock --generate-hashes --no-header --allow-unsafe
          diff requirements.lock /tmp/requirements.lock || (echo "::error::requirements.lock is out of date vs requirements.txt. Run: cd src/mcp && pip-compile requirements.txt -o requirements.lock --generate-hashes --no-header --allow-unsafe" && exit 1)

  # Frontend
  frontend:
    needs: [changes, lint, typecheck]
    # eslint + tsc + vitest + vite build. Same reasoning as `test`: a PR that
    # breaks the web build must go red on the PR, not on main.
    # Rule 6 dependabot filter — see `test`.
    if: >-
      needs.changes.outputs.code == 'true'
      && (github.event_name != 'pull_request'
      || github.actor != 'dependabot[bot]'
      || contains(github.event.pull_request.labels.*.name, 'dependabot-full-ci'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # No job-level working-directory: scripts/ci/frontend.sh runs from the repo
    # root and cd's where each command belongs, so the Linux path here and the
    # canonical repo's containerised path run ONE definition. The old split
    # (npm in src/web, check-bundle-size.sh overridden back to the root) is
    # exactly the per-step cwd difference that hid a bug once already.
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: src/web/.nvmrc
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      # tsc -b, eslint, vitest, vite build, bundle caps, and the
      # blocking-production / advisory-dev npm audit split all live in the
      # script. The dev-toolchain audit stays advisory INSIDE it; do not
      # "simplify" it to a bare command under `set -e`.
      - run: bash scripts/ci/frontend.sh

  # ---------------------------------------------------------------------------
  # SDK contract. packages/sdk/python and packages/sdk/typescript are PUBLISHED
  # artifacts, and six documents (both SDK READMEs shipped to PyPI/npm,
  # docs/SDK_PUBLISHING.md, src/mcp/app/routers/sdk_version.py,
  # packages/sdk/python/src/cerid/__version__.py and release-sdk-python.yml)
  # tell consumers a `sdk-contract` / `sdk-openapi-drift` gate enforces the
  # contract. Until now that gate existed on this repo only as two scripts
  # nothing invoked and a Makefile target a developer had to remember.
  #
  # The drift step is the reason the job installs the runtime stack:
  # gen_sdk_openapi.py imports the real MCP app so the committed baseline
  # matches what the server publishes at /sdk/v1/openapi.json byte-for-byte.
  # ---------------------------------------------------------------------------
  sdk-contract:
    needs: [changes, lint, typecheck]
    # Rule 6 dependabot filter — see `test`.
    if: >-
      needs.changes.outputs.code == 'true'
      && (github.event_name != 'pull_request'
      || github.actor != 'dependabot[bot]'
      || contains(github.event.pull_request.labels.*.name, 'dependabot-full-ci'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: src/mcp/requirements.lock
      - name: Python SDK contract tests
        run: bash scripts/ci/sdk-contract-python.sh
      - name: sdk-openapi-drift
        # The name six documents promise. Needs the MCP runtime, not just the
        # SDK: the spec is rendered from the live FastAPI routes.
        run: |
          pip install -r src/mcp/requirements.txt
          python scripts/gen_sdk_openapi.py --check
      - uses: actions/setup-node@v7
        with:
          node-version-file: src/web/.nvmrc
          cache: npm
          cache-dependency-path: packages/sdk/typescript/package-lock.json
      - name: TypeScript SDK contract tests
        run: bash scripts/ci/sdk-contract-ts.sh

  # ---------------------------------------------------------------------------
  # Distributed npm artifacts: the embeddable widget, the TypeScript SDK and
  # the browser extension. `npm run build` is the point, not an extra — the
  # widget's committed CDN bundle was broken from 2026-06-08 and no check
  # reported it, because nothing in CI ever built these packages. The script
  # re-hashes packages/widget/dist around a fresh build so a stale committed
  # bundle goes red.
  # ---------------------------------------------------------------------------
  packages:
    needs: [changes, lint, typecheck]
    # Rule 6 dependabot filter — see `test`.
    if: >-
      needs.changes.outputs.code == 'true'
      && (github.event_name != 'pull_request'
      || github.actor != 'dependabot[bot]'
      || contains(github.event.pull_request.labels.*.name, 'dependabot-full-ci'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: src/web/.nvmrc
          cache: npm
          cache-dependency-path: |
            packages/widget/package-lock.json
            packages/sdk/typescript/package-lock.json
            packages/extension/package-lock.json
      - run: bash scripts/ci/packages.sh

  # ---------------------------------------------------------------------------
  # License denylist. Replaces the two inline `--fail-on` / `--failOn` audits
  # that used to live in `test` and `frontend`.
  #
  # Those flags do an EXACT-STRING match against SPDX ids, and most packages
  # report Trove-classifier prose instead — "GNU General Public License v3
  # (GPLv3)" never matches "GPL-3.0-only". On 2026-08-05 that let a GPL-3.0
  # package (pcodedmp, pulled transitively by extract-msg) pass this repo's
  # gate green on a release commit, while the canonical repo's scanner caught
  # it. scripts/lint-license-denylist.py matches both string shapes and handles
  # compound "A; B" / "A OR B" licenses instead of substring-matching them.
  #
  # The scanner and its allowlist were already committed here; nothing invoked
  # them. Now something does.
  #
  # No paths-filter: requirements.txt pins RANGES, so a new transitive
  # dependency can arrive with no manifest change at all.
  # ---------------------------------------------------------------------------
  license-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"  # public pins 3.11 (see .sync-manifest.yaml); canonical is 3.12
          cache: pip
      - name: Python license scan (pip-licenses)
        # Resolves licences from the LOCK via PyPI metadata rather than
        # installing the tree (which pulls torch just to read metadata), and
        # scans what actually ships rather than what resolves on the runner.
        run: |
          pip install -q pyyaml
          python scripts/collect-lock-licenses.py --lock src/mcp/requirements.lock --output /tmp/pip-licenses.json
          python scripts/lint-license-denylist.py --tool pip-licenses --input /tmp/pip-licenses.json --label python
      - uses: actions/setup-node@v7
        with:
          node-version-file: src/web/.nvmrc
          cache: npm
          # REQUIRED: `cache: npm` resolves lockfiles from the REPO ROOT, and
          # this repo has none — they all live under package dirs. Without this
          # the step fails "Dependencies lock file is not found" and takes the
          # Node scan with it. Caught on the canonical repo the first time this
          # job was allowed to reach the step at all.
          cache-dependency-path: |
            src/web/package-lock.json
            packages/widget/package-lock.json
            packages/sdk/typescript/package-lock.json
      - name: Node license scan (license-checker)
        # The npm roots that ship an artifact in THIS repo: the web bundle, the
        # embeddable widget, and the published SDK. packages/desktop is
        # internal-only and absent here.
        run: |
          set -e
          pip install -q pyyaml
          for pkg in src/web packages/widget packages/sdk/typescript; do
            label=$(basename "$pkg")
            echo "::group::license-checker: $pkg"
            (cd "$pkg" && npm ci --no-audit --no-fund)
            (cd "$pkg" && npx --yes license-checker@25.0.1 --production --json) > "/tmp/lc-$label.json"
            python3 scripts/lint-license-denylist.py --tool license-checker --input "/tmp/lc-$label.json" --label "$label"
            echo "::endgroup::"
          done

  # Docker
  docker:
    runs-on: ubuntu-latest
    needs: [changes, lint, typecheck, test, security, lock-sync, frontend, license-scan]
    # Rule 7: high-cost gate — two image builds plus two Trivy scans. Merge-time
    # only, which now means the merge QUEUE as well as push:main; before
    # merge_group existed this job could only ever report after the merge.
    # No dependabot filter: this job never runs on pull_request anyway.
    if: >-
      needs.changes.outputs.code == 'true'
      && (github.event_name == 'merge_group'
      || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    timeout-minutes: 45
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v6
      - name: Free disk space for Trivy image scan
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/share/boost \
            /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift || true
          sudo docker system prune -af --volumes || true
          df -h
      # One definition shared with the internal tree (scripts/ci/docker-gate.sh):
      # hadolint both Dockerfiles, build both images, Trivy-scan both with the
      # ignore list the script carries (every entry has a rationale and a
      # re-evaluate date). The inline hadolint/Trivy steps this replaces kept
      # their own .trivyignore and went red on CVE-2026-58659 while the same
      # images passed internally.
      - name: hadolint + build + Trivy (one definition, both paths)
        run: bash scripts/ci/docker-gate.sh
  # frontend-marketing: removed — marketing site separated to Cerid-AI/cerid-ai-marketing repo
  # frontend-desktop: removed — desktop (Electron) build lives in internal repo only

  # ── Single required status check ──────────────────────────────────────────
  # Branch protection requires THIS job, not the individual jobs. It always
  # runs (if: always()) and aggregates the real jobs.
  #
  # A skip is tolerated in general — a docs-only PR skips every job above via
  # the `changes` gate and must still get a green required check (otherwise the
  # required check never reports and the PR is blocked forever).
  #
  # But on a CODE push to main, a skip means a dependency failed and the gate
  # behind it never executed — and GitHub renders that as a grey check, not a
  # red one. `docker` sat skipped for eight consecutive main runs on
  # 2026-08-03 behind a failing `security` job, accumulating Trivy drift with
  # no red signal. So `--enforce-ran` is passed for exactly that case:
  # (push + main, or merge_group) + changes.code == 'true'. merge_group is the
  # one that blocks a bad merge rather than reporting one — without it here,
  # a job skipped inside the queue would still let the entry through.
  #
  # The old inline form collapsed results with join(needs.*.result), which lost
  # the job NAMES — its error read "a required CI job failed", with no way to
  # tell which. The script names every offender.
  ci-ok:
    name: ci / all-required-gates-ran
    needs: [changes, lint, typecheck, test, security, lock-sync, frontend, license-scan, sdk-contract, packages, docker]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Every required gate ran and passed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python scripts/lint-ci-required-gates.py \
            --needs "$NEEDS_JSON" \
            ${{ ((github.event_name == 'merge_group' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && needs.changes.outputs.code == 'true') && '--enforce-ran' || '' }}
