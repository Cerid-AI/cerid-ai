version: 2
updates:
  # Python (pip)
  - package-ecosystem: pip
    directory: /src/mcp
    schedule:
      interval: weekly
      day: monday
    # Group non-major bumps; majors get their own PRs so they can be
    # audited/tested individually (e.g. chromadb must stay pinned to <0.6
    # until the server is upgraded).
    groups:
      python-deps:
        patterns: ["*"]
        update-types:
          - "minor"
          - "patch"
    # The chromadb `ignore` here was removed on 2026-08-31: its stated reason
    # — "server pin (ChromaDB 0.5.23) dictates client version" — stopped being
    # true when the server moved to 1.5.9 and requirements.txt recorded the pin
    # as lifted in migration Phase 3. The rule outlived its reason and was
    # quietly excluding a core dependency from every update cycle.
    commit-message:
      prefix: "deps(py):"

  # NPM
  - package-ecosystem: npm
    directory: /src/web
    schedule:
      interval: weekly
      day: monday
    # Group non-major bumps; majors get their own PRs so each breaking-change
    # migration (TypeScript 6, Vite 8, ESLint 10, etc.) can be staged and
    # audited independently.
    groups:
      npm-deps:
        patterns: ["*"]
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Covers both `eslint` and `@eslint/js`, which move together.
      # The original blocker HAS CLEARED: eslint-plugin-react-hooks@7.1.1 is
      # stable and peers `^10.0.0` (registry-verified 2026-08-31), and
      # eslint@10.9.1 is released. The ignore stays only because ESLint 9 -> 10
      # is a scheduled upgrade, not because anything prevents it.
      # Re-eval 2026-11-30.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "deps(npm):"

  # NPM — embeddable widget (separate package, own lockfile)
  - package-ecosystem: npm
    directory: /packages/widget
    schedule:
      interval: weekly
      day: monday
    groups:
      widget-npm-deps:
        patterns: ["*"]
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "deps(npm):"

  # NPM — published TypeScript SDK (own lockfile, ships to npm)
  #
  # Added 2026-08-28. Until then this directory was in the dependency graph but
  # in no update schedule, so nothing routine ever bumped it and it accumulated
  # advisories that only a manual pass caught. Note this file is deliberately
  # NOT synced from the internal repo — the two trees do not ship the same
  # packages, so each declares the ecosystems it actually has.
  - package-ecosystem: npm
    directory: /packages/sdk/typescript
    schedule:
      interval: weekly
      day: monday
    groups:
      sdk-npm-deps:
        patterns: ["*"]
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "deps(npm):"

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "deps(ci):"

  # Docker — MCP
  - package-ecosystem: docker
    directory: /src/mcp
    schedule:
      interval: monthly
    # Python runtime upgrades are platform-infrastructure changes with
    # coordinated touches to Dockerfile + CI + pyproject.toml + mypy config
    # + DEPENDENCY_COUPLING.md. They are tracked in docs/DEPENDENCY_UPGRADES.md
    # and get their own dedicated PR (3.11 -> 3.12 first, not the jump to
    # 3.14 dependabot keeps proposing). Ignore major + minor base-image bumps
    # until scheduled; patch bumps (security) still land.
    #
    # Still accurate 2026-08-31: every python pin is 3.12. Re-eval 2026-11-30.
    ignore:
      - dependency-name: "python"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
    commit-message:
      prefix: "deps(docker):"

  # Docker — Web
  - package-ecosystem: docker
    directory: /src/web
    schedule:
      interval: monthly
    commit-message:
      prefix: "deps(docker):"

  # Docker — Infrastructure (Neo4j, ChromaDB, Redis)
  - package-ecosystem: docker
    directory: /stacks/infrastructure
    schedule:
      interval: monthly
    commit-message:
      prefix: "deps(docker):"

  # Docker — Gateway (Caddy)
  - package-ecosystem: docker
    directory: /stacks/gateway
    schedule:
      interval: monthly
    commit-message:
      prefix: "deps(docker):"

  # Docker — Tunnel (Cloudflare)
  - package-ecosystem: docker
    directory: /stacks/tunnel
    schedule:
      interval: monthly
    commit-message:
      prefix: "deps(docker):"

  # ---------------------------------------------------------------------------
  # Added 2026-08-31 so scripts/lint-dependency-currency.py passes here too.
  # Six directories held a manifest that no entry watched, so their pins could
  # age indefinitely with nothing reporting. The root compose is the important
  # one: neo4j, redis and chroma were watched by nothing at all.
  # ---------------------------------------------------------------------------
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "deps(docker):"

  - package-ecosystem: docker
    directory: /stacks/connectors
    schedule:
      interval: monthly
    commit-message:
      prefix: "deps(docker):"

  - package-ecosystem: docker
    directory: /stacks/langfuse
    schedule:
      interval: monthly
    commit-message:
      prefix: "deps(docker):"

  - package-ecosystem: npm
    directory: /packages/extension
    schedule:
      interval: weekly
      day: monday
    groups:
      extension-npm-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "deps(npm):"

  - package-ecosystem: npm
    directory: /tests/beta/e2e
    schedule:
      interval: weekly
      day: monday
    groups:
      e2e-npm-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "deps(npm):"

  - package-ecosystem: pip
    directory: /packages/sdk/python/examples/telegram-capture
    schedule:
      interval: monthly
    groups:
      example-py-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "deps(py):"
