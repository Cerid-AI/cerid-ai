[project]
name = "cerid-ai"
version = "1.0.3"
description = "Privacy-first Personal AI Knowledge Companion"
requires-python = ">=3.12"
license = "FSL-1.1-ALv2"
license-files = ["LICENSE"]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src/mcp"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "BLE001"]
ignore = ["E501"]  # line length handled by formatter
# Progressive quality rules (tracked, not CI-gating until sweep complete):
# ERA001 (commented-out code): ruff check src/mcp/ --select ERA -q | wc -l

[tool.ruff.lint.per-file-ignores]
"main.py" = ["E402", "BLE001"]  # sentry_sdk.init() must run before all other imports; top-level exception handler
"**/main.py" = ["E402", "BLE001"]
"**/error_handler.py" = ["BLE001"]  # error handler must catch all exceptions
"**/degradation.py" = ["BLE001"]  # degradation probes must catch all exceptions
"**/agent_events.py" = ["BLE001"]  # fire-and-forget SSE events must not crash caller
"app/main.py" = ["E402", "BLE001"]  # sentry_sdk.init() must run before all other imports
"**/tests/**" = ["BLE001"]  # test files can use broad except for test isolation
"**/core/**" = ["BLE001"]  # core/ extracted from branch without BLE001 annotations; sweep planned
"**/app/**" = ["BLE001"]  # app/ extracted from branch without BLE001 annotations; sweep planned
"scripts/cerid-sidecar.py" = ["E402"]  # FastAPI imports follow heavy model-loading helpers by design

[tool.mypy]
python_version = "3.12"
files = ["src/mcp"]
exclude = ["scripts/", "tests/"]
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
explicit_package_bases = true
mypy_path = ["src/mcp"]

[tool.pytest.ini_options]
testpaths = ["src/mcp/tests"]
asyncio_mode = "auto"
markers = [
    "unit: Fast tests with no external dependencies",
    "integration: Tests requiring Docker services (Neo4j, ChromaDB, Redis)",
    "eval: Evaluation harness — Monte Carlo, RAGAS, benchmarks (slow, optional)",
    "benchmark_slo: Latency SLO benchmarks — require a running MCP stack (excluded from default pytest run)",
    "preservation: Capability-preservation gates for the consolidation program — run against a live stack, merge-gate for every sprint. See tasks/2026-04-19-consolidation-program.md",
    "chaos: Integration tests for the background processor — fakeredis, no Docker required",
    "live_stack: Needs a running stack but takes no live-stack fixture (drives a router that calls get_redis/get_neo4j internally). Honoured by tests/integration/conftest.py::uses_live_stack — fixture-shape inference cannot detect these.",
]

[tool.importlinter]
root_packages = ["core", "app", "config"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "core must not import app"
type = "forbidden"
source_modules = ["core"]
forbidden_modules = ["app", "routers", "services", "middleware", "parsers", "sync", "models", "deps", "tools", "main", "scheduler", "db", "eval", "stores", "agents"]

# config→utils boundary removed: config.settings legitimately imports utils.model_registry
# The critical boundary (core must not import app) is enforced above

# ---------------------------------------------------------------------------
# Mutation testing (mutmut) — measures whether the suite DETECTS injected
# faults, not merely whether it executes lines. Added after the 2026-07-29
# audit found green tests coexisting with a backup that silently discarded the
# entire vector store: coverage said "tested", mutation testing asks "would a
# defect here be caught?".
#
# Scoped to the modules where a green-but-blind suite is most dangerous —
# data durability, lifecycle, privacy gating, auth. Widen deliberately: each
# mutant re-runs the selected tests, so cost scales with paths × suite time.
#
#   .venv/bin/mutmut run          # generate + test mutants
#   .venv/bin/mutmut results      # surviving mutants = blind spots
#   .venv/bin/mutmut show <id>    # the exact undetected change
# ---------------------------------------------------------------------------
[tool.mutmut]
source_paths = [
    "src/mcp/app/sync/export.py",
    "src/mcp/app/sync/tombstones.py",
    "src/mcp/app/services/private_mode.py",
    "src/mcp/app/middleware/auth.py",
]
# Scoped to the tests that actually cover the mutated modules. mutmut requires
# a green baseline and re-runs this selection per mutant, so pointing it at the
# whole suite both failed (integration tests need a live stack) and would cost
# ~90s × N mutants.
pytest_add_cli_args_test_selection = [
    "src/mcp/tests/test_sync.py",
    "src/mcp/tests/test_sync_full_surface.py",
    "src/mcp/tests/test_middleware_auth.py",
    "src/mcp/tests/test_mcp_auth_lan_gating.py",
    "src/mcp/tests/test_domain_privacy.py",
]
