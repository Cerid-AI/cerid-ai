#
# Throwaway-stack overrides for docker-compose.yml. Two purposes:
#
# 1. RESOURCE FIT — a 2-CPU box (a GitHub Actions ubuntu runner, or a laptop
#    you do not want to hand four cores) cannot take the root compose's neo4j
#    cpus: '4.0' and heap+pagecache; it hard-fails with "range of CPUs is from
#    0.01 to 2.00". Shrink to fit.
#
# 2. ISOLATION — the root compose hardcodes container_name: ai-companion-* and
#    joins the shared external `llm-network`, so bringing a second stack up (or
#    running `down -v` on it) clobbers the dev stack's containers and volumes:
#    the 2026-06-07 incident. This overlay suffixes every container with -ci and
#    runs on its own bridge, with aliases so the canonical hostnames still
#    resolve INSIDE the throwaway stack. Offset the published ports via
#    CERID_PORT_* and set COMPOSE_PROJECT_NAME=cerid-ci and the two stacks
#    coexist on one host without touching each other.
#
# NO WORKFLOW IN THIS REPO USES THIS FILE. Its consumers are docs/SANDBOX_TESTING.md
# (recipe 3) and anyone booting a second stack by hand. The live-stack jobs the
# isolation rules were written for — preservation, benchmark-slo, and their
# self-hosted runner — belong to the internal development pipeline and are not
# part of the public CI; do not read this header as documentation that they run
# here. scripts/lint-ci-compose-namespacing.py keeps the overrides honest
# against the root compose either way.
#
# Layered via: docker compose -f docker-compose.yml -f docker-compose.ci.yml up

services:
  neo4j:
    container_name: ai-companion-neo4j-ci
    networks:
      llm-network:
        aliases:
          - ai-companion-neo4j
    # Ephemeral, project-scoped store (NOT the host bind-mount). The root
    # compose binds ./stacks/.../data/neo4j, which on a dev machine is the
    # SAME dir the dev neo4j holds — two neo4j on one store => the CI one is
    # unhealthy and the boot fails. Named volumes are isolated per project and
    # `down -v` wipes them, so every CI run starts from a clean store.
    volumes:
      - ci-neo4j-data:/data
      - ci-neo4j-logs:/logs
    environment:
      # Root compose sets heap=1G + pagecache=2G = 3G, which exceeds the
      # 2G cgroup limit we apply below — neo4j reads cgroup-aware memory
      # and refuses to start with "Invalid memory configuration - exceeds
      # physical memory". Shrink both knobs to fit a preservation-only
      # workload inside the runner's tighter budget.
      - NEO4J_server_memory_heap_max__size=512m
      - NEO4J_server_memory_pagecache_size=512m
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G

  chromadb:
    container_name: ai-companion-chroma-ci
    networks:
      llm-network:
        aliases:
          - ai-companion-chroma
    # Ephemeral store (see neo4j note) — Chroma's SQLite also can't share a dir.
    volumes:
      - ci-chroma-data:/data

  redis:
    container_name: ai-companion-redis-ci
    networks:
      llm-network:
        aliases:
          - ai-companion-redis
    # Ephemeral store (see neo4j note) — two redis on one AOF dir corrupt it.
    volumes:
      - ci-redis-data:/data

  mcp-server:
    container_name: ai-companion-mcp-ci
    networks:
      llm-network:
        aliases:
          - ai-companion-mcp

  cerid-web:
    container_name: cerid-web-ci
    networks:
      llm-network:
        aliases:
          - cerid-web

networks:
  # Own bridge so the CI stack never shares the dev stack's external
  # llm-network. Name pinned so repeated up/down cycles don't churn it.
  llm-network:
    name: cerid-ci-llm-network
    external: false

volumes:
  # Project-scoped, ephemeral CI stores — isolated from the dev stack's host
  # bind-mounts and wiped by `down -v` so each run starts clean.
  ci-neo4j-data:
  ci-neo4j-logs:
  ci-chroma-data:
  ci-redis-data:
