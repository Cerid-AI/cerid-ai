<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cerid Widget — Smoke Test</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      margin: 0;
      padding: 40px;
      background: #f9fafb;
      color: #111827;
    }
    h1 { font-size: 1.5rem; margin-bottom: 8px; }
    p { color: #6b7280; margin-bottom: 24px; }
    .info {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 14px;
      color: #1d4ed8;
      max-width: 480px;
    }
  </style>
</head>
<body>
  <h1>Cerid Widget Smoke Test</h1>
  <p>
    The <code>&lt;cerid-chat&gt;</code> web component loads in the bottom of the page.
    Point it at your Cerid deployment with the <code>host</code> attribute.
  </p>

  <div class="info">
    <strong>Dev mode:</strong> This example points to <code>http://localhost:8000</code>.
    Make sure your Cerid server is running and CORS is configured to allow this origin.
  </div>

  <!--
    CDN usage:
    <script src="https://cdn.cerid.ai/widget@0.1/cerid-widget.js"></script>
  -->
  <script type="module" src="../dist/cerid-widget.js"></script>

  <cerid-chat
    host="http://localhost:8000"
    theme="auto"
    placeholder="Ask Cerid anything..."
  ></cerid-chat>
</body>
</html>
